worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Docker's embedded DNS. Re-resolve the API container when it is recreated
  # instead of keeping a stale address or failing during a brief startup gap.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream cli_proxy_api {
    zone cli_proxy_api 64k;
    server cli-proxy-api:8317 resolve;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    location = /healthz {
      proxy_pass http://cli_proxy_api/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
      return 308 /api/;
    }

    # /api is the only public route to CLIProxyAPI. The prefix is removed upstream.
    location ^~ /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://cli_proxy_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control 'no-store' always;
    }
  }
}
